name: windows-build

# Builds the standalone Qt app for Windows on every push to master, on
# demand, and publishes a downloadable release zip whenever a v* tag is
# pushed. The zip contains omakon.exe + all Qt runtime DLLs/plugins,
# ready to unzip-and-run on any Windows 10+ machine.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        working-directory: standalone
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: standalone
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        working-directory: standalone
        run: |
          # windeployqt stages ALL required DLLs/plugins next to the exe —
          # that folder IS the redistributable. Copy it wholesale as dist/.
          windeployqt --release --qmldir . build/omakon.exe
          Copy-Item build dist -Recurse -Exclude '*.obj','*.cpp','CMakeFiles','.qt','.ninja*'

      - name: Package zip
        working-directory: standalone
        run: |
          $shaver = "${{ github.sha }}".Substring(0,7)
          Compress-Archive dist/* "omakon-windows-$shaver.zip"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: omakon-windows
          path: standalone/omakon-windows-*.zip
          retention-days: 30

      # Tag pushes publish a public release so players don't need a GitHub
      # login (Actions artifacts require auth to download).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: standalone/omakon-windows-*.zip
          generate_release_notes: true
