name: windows-build

# Builds the standalone Qt app for Windows on every push to master, on
# demand, and publishes a downloadable release zip whenever a v* tag is
# pushed. The zip contains omakon.exe + all Qt runtime DLLs/plugins,
# ready to unzip-and-run on any Windows 10+ machine.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    # The default GITHUB_TOKEN is read-only, which blocks the
    # action-gh-release step on tag pushes (403 "Resource not accessible
    # by integration"). The tag step only needs to create releases.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      # CMake was picking up the runner's preinstalled MinGW gcc, which is
      # ABI-incompatible with the MSVC Qt build above. Enter the MSVC dev
      # shell so cl.exe wins compiler detection.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        working-directory: standalone
        # Project is CXX-only, so only pin the C++ compiler (pinning C too
        # trips a harmless "unused variable" CMake warning).
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build
        working-directory: standalone
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        working-directory: standalone
        run: |
          # windeployqt stages the runtime next to the exe. Copy ONLY the
          # runtime (exe + top-level DLLs + plugin/style/locale dirs) so
          # build intermediates (CMakeFiles/, .qt/, .rcc/, omakon.lib,
          # build.ninja, .ninja_*, staged sources) don't leak into the zip.
          windeployqt --release --qmldir . build/omakon.exe
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/*.exe dist/
          Copy-Item build/*.dll dist/
          foreach ($d in @('platforms','qml','tls','iconengines','imageformats','styles','generic','networkinformation','translations')) {
            if (Test-Path "build/$d") { Copy-Item "build/$d" dist/ -Recurse -Force }
          }

          # Make the folder truly self-contained. windeployqt ships the
          # vc_redist.x64.exe installer instead of the CRT DLLs, which needs
          # an interactive install and breaks a clean unzip-and-run on a
          # machine without the VC++ Redistributable. Copy the redist CRT
          # DLLs next to the exe — Windows resolves the app folder before
          # the system, so the app uses the bundled ones.
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -property installationPath
            $crtDlls = Get-ChildItem -Path (Join-Path $vsPath "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll") -ErrorAction SilentlyContinue
            if ($crtDlls) {
              $crtDlls | ForEach-Object { Copy-Item $_.FullName dist/ -Force }
              Write-Host "Bundled CRT DLLs:"
              $crtDlls | ForEach-Object { Write-Host "  $($_.Name)" }
            } else {
              Write-Host "WARNING: could not locate MSVC CRT DLLs; vc_redist.x64.exe is the only runtime path in this build"
            }
          } else {
            Write-Host "WARNING: vswhere not found; skipping CRT bundling (vc_redist.x64.exe fallback remains)"
          }

      - name: Package zip
        working-directory: standalone
        run: |
          $shaver = "${{ github.sha }}".Substring(0,7)
          Compress-Archive dist/* "omakon-windows-$shaver.zip"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: omakon-windows
          path: standalone/omakon-windows-*.zip
          retention-days: 30

      # Tag pushes publish a public release so players don't need a GitHub
      # login (Actions artifacts require auth to download).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: standalone/omakon-windows-*.zip
          generate_release_notes: true
